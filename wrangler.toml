name = "poker-banca"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# D1 binding — sustituye el database_id por el que genere wrangler al crear la DB.
[[d1_databases]]
binding = "DB"
database_name = "poker-banca"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# Las variables sensibles (AUTH_PASSWORD, AUTH_SECRET) se configuran como
# *secrets* desde el panel de Cloudflare Pages o con `wrangler pages secret put`,
# NO se ponen aquí en plano.
